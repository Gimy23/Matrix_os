# ==============================================================================
# MATRIX OS — Kitty Terminal Configuration
# Optimized for Intel UHD Graphics 620 & 1920x1080 Wayland
# ==============================================================================

include matrix-os.conf

# Typography — JetBrains Mono Nerd Font with safe system fallbacks
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Disable ligatures on cursor for crisp code/CLI editing
disable_ligatures cursor

# Cursor — clean static block, no trail/animation overhead
cursor_shape     block
cursor_blink_interval 0

# Window & layout — subtle borders, balanced padding, no transparency overhead
background_opacity         1.0
dynamic_background_opacity no
window_padding_width       10
window_border_width        1pt
draw_minimal_borders       yes
hide_window_decorations    no
remember_window_size       yes
initial_window_width       110c
initial_window_height      32c

# Tab bar — clean minimal bar
tab_bar_edge            top
tab_bar_style           separator
tab_separator           " │ "
tab_bar_min_tabs        2
tab_title_template      "{index}: {title}"

# Performance & Wayland tuning (low GPU/CPU overhead)
repaint_delay           10
input_delay             3
sync_to_monitor         yes
enable_audio_bell       no
visual_bell_duration    0.0
scrollback_lines        10000

# Shell integration
shell /usr/bin/fish
shell_integration enabled

# Useful keybindings
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0
